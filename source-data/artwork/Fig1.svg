<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1104" viewBox="0 0 1672 1104" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Conventional distillation and DICE</title>
  <desc id="figure-description">Editable Arial revision of the reference workflow: red teacher sampling, yellow Selective DFT and a direct low-support-to-DFT-to-teacher-training feedback loop.</desc>
  <defs>
    <!-- Subtle colour variation is retained for fidelity to the supplied artwork. -->
    <linearGradient id="salmon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc1b9"/>
      <stop offset="0.48" stop-color="#ffb0a6"/>
      <stop offset="1" stop-color="#ffb6aa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7e2ff"/>
      <stop offset="0.5" stop-color="#add9fc"/>
      <stop offset="1" stop-color="#b5e0fa"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedb4"/>
      <stop offset="0.5" stop-color="#ffebb0"/>
      <stop offset="1" stop-color="#fff1bd"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="15" viewBox="0 0 16 15" refX="15" refY="7.5" orient="auto">
      <path d="M 0 0 L 15 7.5 L 0 15 Z" fill="#080808"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #000000; }
      .node { stroke: #080808; stroke-width: 1.55; fill: #eee8f7; }
      .boundary { stroke: #080808; stroke-width: 2.05; fill: #ffffff; }
      .connector { fill: none; stroke: #080808; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
      .body { font-size: 26px; font-weight: 400; text-anchor: middle; }
      .strong { font-size: 26px; font-weight: 700; text-anchor: middle; }
      .panel-title { font-size: 38px; font-weight: 700; }
      .route-label { font-size: 24px; font-weight: 400; }
      .legend-text { font-size: 22.5px; font-weight: 400; }
    </style>
  </defs>

  <rect id="canvas" x="0" y="0" width="1672" height="1104" fill="#ffffff"/>

  <g id="workflow-comparison-frames" fill="none" stroke="#595959" stroke-width="2.2" stroke-dasharray="10 7">
    <rect id="conventional-workflow-frame" x="12" y="82" width="1648" height="336" rx="24"/>
    <rect id="dice-workflow-frame" x="12" y="512" width="1648" height="582" rx="24"/>
  </g>

  <g transform="translate(-20 35) scale(1.22)" id="conventional-distillation">
    <g id="conventional-connectors" class="connector">
      <path id="left-cycle" d="M 82 159 H 69 Q 46 159 46 181 V 242 Q 46 264 69 264 H 82"/>
      <path id="left-cycle-upper-head" d="M 46 181 V 179 Q 46 159 69 159 H 82" class="arrow"/>
      <path id="left-cycle-lower-head" d="M 46 242 V 244 Q 46 264 69 264 H 82" class="arrow"/>
      <path id="sampling-to-selective-dft" d="M 300 159 H 311 Q 333 159 333 181 V 242 Q 333 264 311 264 H 300" class="arrow"/>
      <path id="reference-to-teacher-training" d="M 333 209 H 365" class="arrow"/>
      <path id="training-to-teacher" d="M 497 209 H 525" class="arrow"/>
      <path id="frozen-teacher-to-sampling" d="M 647 209 H 819" class="arrow"/>
      <path id="sampling-to-labels" d="M 1010 209 H 1032" class="arrow"/>
      <path id="labels-to-student" d="M 1186 209 H 1215" class="arrow"/>
    </g>

    <g id="conventional-sampling">
      <rect class="node" x="82" y="120" width="218" height="79" rx="16" style="fill:url(#salmon)"/>
      <text class="strong" x="191" y="154"><tspan x="191">Teacher-driven</tspan><tspan x="191" dy="29">exploration</tspan></text>
    </g>
    <g id="conventional-selective-dft">
      <rect class="node" x="82" y="233" width="218" height="63" rx="16" style="fill:url(#yellow)"/>
      <text class="strong" x="191" y="273">Selective DFT</text>
    </g>
    <g id="conventional-teacher-training">
      <rect class="node" x="365" y="169" width="132" height="80" rx="16"/>
      <text class="body" x="431" y="201"><tspan x="431">Teacher</tspan><tspan x="431" dy="29">training</tspan></text>
    </g>
    <g id="conventional-teacher">
      <rect class="node" x="525" y="169" width="122" height="80" rx="16"/>
      <text class="body" x="586" y="217">Teacher</text>
    </g>
    <text id="frozen-teacher-label" class="route-label" x="733" y="189" text-anchor="middle" style="font-weight:700;font-size:23px">Frozen teacher</text>
    <g id="conventional-label-sampling">
      <rect class="node" x="819" y="167" width="191" height="82" rx="16"/>
      <text class="body" x="914.5" y="201"><tspan x="914.5">Configuration</tspan><tspan x="914.5" dy="29">exploration</tspan></text>
    </g>
    <g id="conventional-teacher-labelled-data">
      <rect class="node" x="1041" y="141" width="144" height="106" rx="14"/>
      <rect class="node" x="1036" y="151" width="144" height="106" rx="14"/>
      <rect class="node" x="1032" y="160" width="141" height="106" rx="14"/>
      <text class="body" x="1102.5" y="193"><tspan x="1102.5">Teacher-</tspan><tspan x="1102.5" dy="28">labelled</tspan><tspan x="1102.5" dy="28">data</tspan></text>
    </g>
    <g id="conventional-student-training">
      <rect class="node" x="1215" y="167" width="139" height="82" rx="16"/>
      <text class="body" x="1284.5" y="201"><tspan x="1284.5">Student</tspan><tspan x="1284.5" dy="29">training</tspan></text>
    </g>
    <text class="panel-title" x="79" y="83">Conventional distillation</text>
  </g>

  <g id="conventional-to-dice-transition" aria-label="Transition from conventional distillation to DICE">
    <path id="workflow-comparison-arrow" d="M 825 430 H 847 V 470 H 864 L 836 500 L 808 470 H 825 Z" fill="#080808"/>
  </g>

  <g transform="translate(-20 59) scale(1.22)" id="dice">
    <rect id="rn-loop-boundary" class="boundary" x="855" y="399" width="499" height="340" rx="32"/>
    <g id="dice-connectors" class="connector">
      <path id="teacher-training-to-teacher" d="M 247 551 H 322" class="arrow"/>
      <path id="teacher-to-routing" d="M 462 551 H 537" class="arrow"/>
      <path id="high-support-to-labels" d="M 695 526 H 889" class="arrow"/>
      <path id="teacher-labels-to-student-training" d="M 1062 524 H 1135" class="arrow"/>
      <path id="student-training-to-exploration" d="M 1285 524 H 1308 Q 1328 524 1328 544 V 648 Q 1328 668 1308 668 H 1224" class="arrow"/>
      <path id="exploration-to-support-routing" d="M 967 669 H 690 Q 668 669 668 647 V 610" class="arrow"/>
      <path id="low-support-to-selective-dft" d="M 616 610 V 765" class="arrow"/>
      <path id="selective-dft-to-teacher-training" d="M 504 800 H 186.5 Q 164.5 800 164.5 778 V 595" class="arrow"/>
    </g>

    <g id="dice-teacher-training">
      <rect class="node" x="82" y="507" width="165" height="88" rx="16"/>
      <text class="body" x="164.5" y="545"><tspan x="164.5">Teacher</tspan><tspan x="164.5" dy="29">training</tspan></text>
    </g>
    <g id="dice-teacher">
      <rect class="node" x="322" y="509" width="140" height="86" rx="16"/>
      <text class="body" x="392.0" y="560">Teacher</text>
    </g>
    <g id="support-guided-routing">
      <rect class="node" x="537" y="494" width="158" height="116" rx="18"/>
      <text class="strong" x="616.0" y="529"><tspan x="616.0">Support-</tspan><tspan x="616.0" dy="29">guided</tspan><tspan x="616.0" dy="29">routing</tspan></text>
    </g>
    <text id="high-support-label" class="route-label" x="781" y="511" text-anchor="middle" style="font-size:23px;font-weight:700">High support</text>
    <text id="low-support-label" class="route-label" x="604" y="687" text-anchor="end" font-weight="700" style="font-weight:700">Low support</text>

    <g id="dice-teacher-labelled-data">
      <rect class="node" x="905" y="462" width="156" height="105" rx="15"/>
      <rect class="node" x="897" y="471" width="157" height="105" rx="15"/>
      <rect class="node" x="889" y="481" width="159" height="102" rx="16"/>
      <text class="body" x="968.5" y="513"><tspan x="968.5">Teacher-</tspan><tspan x="968.5" dy="28">labelled</tspan><tspan x="968.5" dy="28">data</tspan></text>
    </g>
    <g id="dice-student-training">
      <rect class="node" x="1135" y="484" width="150" height="81" rx="16"/>
      <text class="body" x="1210" y="519"><tspan x="1210">Student</tspan><tspan x="1210" dy="29">training</tspan></text>
    </g>
    <g id="student-driven-sampling">
      <rect class="node" x="967" y="625" width="257" height="83" rx="16" style="fill:url(#blue)"/>
      <text class="strong" x="1095.5" y="657"><tspan x="1095.5">Student-driven</tspan><tspan x="1095.5" dy="29">exploration</tspan></text>
    </g>
    <g id="dice-selective-dft">
      <rect class="node" x="504" y="765" width="224" height="69" rx="15" style="fill:url(#yellow)"/>
      <text class="strong" x="616.0" y="808">Selective DFT</text>
    </g>
    <text id="iter-title" x="1120" y="426" text-anchor="middle" font-size="26" font-weight="700">Within one iteration</text>
    <text id="rn-label" x="1120" y="451" text-anchor="middle" font-size="22">r0, r1, …</text>
    <text id="update-teacher-label" class="route-label" x="334" y="785" text-anchor="middle" style="font-weight:700">Update teacher</text>
    <text id="dice-title" class="panel-title" x="84" y="423" style="font-size:46px">DICE</text>
  </g>

  <g id="legend" aria-label="Shared colour legend" font-size="25">
    <g id="legend-teacher-sampling" transform="translate(207.039 0)">
      <rect x="0" y="24" width="48" height="34" rx="9" fill="url(#salmon)" stroke="#ff3b30" stroke-width="2"/>
      <text x="62" y="32"><tspan x="62">Teacher-driven</tspan><tspan x="62" dy="28">exploration (high cost)</tspan></text>
    </g>
    <g id="legend-student-sampling" transform="translate(570.039 0)">
      <rect x="0" y="24" width="48" height="34" rx="9" fill="url(#blue)" stroke="#0875ff" stroke-width="2"/>
      <text x="62" y="32"><tspan x="62">Student-driven</tspan><tspan x="62" dy="28">exploration (low cost)</tspan></text>
    </g>
    <g id="legend-dft" transform="translate(923.273 0)">
      <rect x="0" y="24" width="48" height="34" rx="9" fill="url(#yellow)" stroke="#dfad00" stroke-width="2"/>
      <text x="62" y="49">Selective DFT</text>
    </g>
    <g id="legend-other" transform="translate(1197.242 0)">
      <rect x="0" y="24" width="48" height="34" rx="9" fill="#eee8f7" stroke="#080808" stroke-width="2"/>
      <text x="62" y="49">Other components</text>
    </g>
  </g>
</svg>
